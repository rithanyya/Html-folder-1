<script>

const points = Array.from(document.querySelectorAll(".points li"));

// shuffle order

points.forEach((point,index)=>{

        point.style.opacity="1";

    }, index * 2000);
});

<script>
let lastScrollTop = 0; // track last scroll position
const navbar = document.querySelector('.navbar');

window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (scrollTop > lastScrollTop) {
        // scrolling down → hide navbar
        navbar.style.top = '-100px'; // moves it out of view
    } else {
        // scrolling up → show navbar
        navbar.style.top = '40px';  // original position
    }

    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // avoid negative
});
</script>
